{% extends 'bases/accounts.html' %}

{% load static %}

{% block title %}
ورود با رمز عبور
{% endblock %}

{% block form %}
<form class="form-style-1 mt-35" method="post">
    {% csrf_token %}

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} color-white">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <div class="mb-4">
        <label for="username" class="form-label">نام کاربری</label>
        <input type="text" class="form-control" name="username" id="username" required>
    </div>

    <div class="mb-4">
        <label for="password" class="form-label">رمز عبور</label>
        <input type="password" name="password" id="password" class="form-control"
            placeholder="رمز عبور خود را وارد کنید" required autofocus>
    </div>

    <button class="btn btn-danger mt-4">
        ورود
    </button>

</form>
{% endblock %}
